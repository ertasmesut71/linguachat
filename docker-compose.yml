version: "3.9"

# ═══════════════════════════════════════════════
# LinguaChat — Docker Compose
#
# Services:
#   app       — Node.js API + WebSocket server
#   postgres  — PostgreSQL 16 database
#   minio     — S3-compatible object storage (optional, for production S3/R2)
#   nginx     — Reverse proxy with WebSocket upgrade + static serving
#   createbucket — one-shot: creates the MinIO bucket (only needed with S3 mode)
#
# Storage modes:
#   DEFAULT (local dev): app uses local filesystem (server/data/uploads/).
#     No S3 env vars needed. MinIO is NOT required.
#
#   S3/R2/MinIO (production): set these env vars on `app`:
#     STORAGE_ENDPOINT, STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY,
#     STORAGE_BUCKET, STORAGE_REGION
#     Then enable minio healthcheck dependency below.
#
# Usage:
#   docker compose up -d              # start all
#   docker compose exec app npm run seed   # seed demo data
#   docker compose logs -f app        # watch logs
#   docker compose down -v            # stop + remove volumes
# ═══════════════════════════════════════════════

services:
  # ─── Application ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # MinIO dependency removed from default config.
      # App uses local filesystem storage by default (no license required).
      # To use MinIO, uncomment the block below and set STORAGE_* env vars:
      # minio:
      #   condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://linguachat:linguachat@postgres:5432/linguachat
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-to-a-64-char-random-hex-string-now}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      BCRYPT_ROUNDS: 12
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      STT_PROVIDER: ${STT_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_WHISPER_MODEL: ${OPENAI_WHISPER_MODEL:-whisper-1}
      # ── Storage ──────────────────────────────────────────────────────────
      # Leave STORAGE_ENDPOINT blank (default) → local filesystem storage.
      # Files are saved to /app/server/data/uploads/ inside the container
      # and persisted via the `mediadata` named volume below.
      #
      # For production S3/R2/MinIO, uncomment and fill these:
      # STORAGE_ENDPOINT: http://minio:9000
      # STORAGE_ACCESS_KEY_ID: minioadmin
      # STORAGE_SECRET_ACCESS_KEY: minioadmin
      # STORAGE_BUCKET: linguachat
      # STORAGE_REGION: us-east-1
    volumes:
      # Persist uploaded media (avatars, voice, images) across container restarts
      - mediadata:/app/server/data/uploads
    networks:
      - internal
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linguachat
      POSTGRES_PASSWORD: linguachat
      POSTGRES_DB: linguachat
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguachat"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── MinIO (S3-compatible object storage) ───
  # Optional: only needed when STORAGE_ENDPOINT is set to use S3 mode.
  # AIStor (quay.io/minio/aistor/minio) requires a paid license for write ops.
  # For local dev, leave STORAGE_ENDPOINT unset and skip this service.
  minio:
    image: quay.io/minio/aistor/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    networks:
      - internal
    expose:
      - "9000"
      - "9001"
    ports:
      - "9001:9001"   # MinIO console (optional, remove in production)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || wget -qO- http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── Create MinIO bucket (one-shot init) ───
  # Only needed when using S3 mode with MinIO.
  createbucket:
    image: quay.io/minio/aistor/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/linguachat --ignore-existing &&
      mc anonymous set download local/linguachat &&
      echo 'Bucket linguachat ready'
      "
    networks:
      - internal
    restart: "no"

  # ─── Nginx reverse proxy ───
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
  mediadata:
    driver: local   # persists avatars + media across container restarts

networks:
  internal:
    driver: bridge
