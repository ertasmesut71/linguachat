version: "3.9"

# ═══════════════════════════════════════════════
# LinguaChat — Development Docker Compose
#
# Provides PostgreSQL + MinIO only.
# Run the Node.js app locally with hot reload.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   npm run db:generate
#   npm run db:push
#   npm run seed
#   npm run dev
# ═══════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linguachat
      POSTGRES_PASSWORD: linguachat
      POSTGRES_DB: linguachat
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguachat"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata_dev:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/linguachat --ignore-existing &&
      mc anonymous set download local/linguachat &&
      echo 'Bucket ready'
      "
    restart: "no"

volumes:
  pgdata_dev:
    driver: local
  miniodata_dev:
    driver: local
